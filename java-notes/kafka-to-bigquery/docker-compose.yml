# Kafka → BigQuery streaming pipeline
#
# Full stack:
#   docker compose --env-file .env up --build
#
# Local debug (Kafka in Docker, apps on host with JDWP):
#   docker compose --env-file .env up -d kafka
#   ./scripts/debug-sink.sh          # wait for debugger on :5005
#   ./scripts/run-producer.sh        # other terminal

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: k2bq_kafka
    ports:
      # Host apps use localhost:${KAFKA_HOST_PORT} (advertised as PLAINTEXT_HOST)
      - "${KAFKA_HOST_PORT:-19092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-3}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 18
      start_period: 15s

  sink:
    build: .
    container_name: k2bq_sink
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["java", "-cp", "/app/pipeline.jar", "com.example.pipeline.BigQuerySinkApp"]
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      FILE_SINK_PATH: /out/events.ndjson
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp.json
    volumes:
      - ./out:/out
      - ./secrets:/secrets:ro
    restart: "no"

  producer:
    build: .
    container_name: k2bq_producer
    depends_on:
      kafka:
        condition: service_healthy
      sink:
        condition: service_started
    entrypoint: ["java", "-cp", "/app/pipeline.jar", "com.example.pipeline.EventProducerApp"]
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    restart: "no"
