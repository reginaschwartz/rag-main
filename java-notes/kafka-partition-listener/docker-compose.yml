# Workstation producer → Docker Kafka (multi-partition topic) → Spring Cloud Stream consumer
#
# The topic is created by kafka-init in this compose file. The workstation JVM never
# creates or stores the topic.
#
# Start the server stack:
#   docker compose up --build
#
# From another terminal, send messages from the host JVM (random partition each time):
#   ./scripts/run-producer.sh
#
# Watch only partition 0 (default LISTEN_PARTITION=0):
#   docker compose logs -f listener
#
# Debug the listener: attach a Remote JVM Debug config to localhost:5007
# (suspend=n, so the process starts immediately).
#
# Listen to a different partition:
#   LISTEN_PARTITION=2 docker compose up --build listener

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kpl_kafka
    ports:
      # Host producer uses localhost:19092 (PLAINTEXT_HOST).
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 18
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kpl_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic ${KAFKA_TOPIC:-workstation.events} \
          --partitions ${TOPIC_PARTITIONS:-3} \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
          --describe --topic ${KAFKA_TOPIC:-workstation.events}

  listener:
    build: .
    container_name: kpl_listener
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure
    ports:
      - "${LISTENER_DEBUG_PORT:-5007}:5007"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-workstation.events}
      TOPIC_PARTITIONS: ${TOPIC_PARTITIONS:-3}
      # Static assignment: this instance consumes only this partition.
      LISTEN_PARTITION: ${LISTEN_PARTITION:-1}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007"
